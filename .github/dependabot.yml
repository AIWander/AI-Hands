# Dependabot configuration — security-only
# Cargo/pip version update blocks removed. Dependabot Security Updates
# (org-level toggle) handles vulnerability fixes for all ecosystems.
# Only GitHub Actions version updates are tracked here.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # No custom labels: Dependabot applies its defaults (dependencies,
    # github_actions) and creates them if missing. A custom label must
    # already exist in the repo, and "github-actions" never did.
